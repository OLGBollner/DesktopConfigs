# Mirrors ~/.config/xfce4/terminal/terminalrc (Catppuccin Macchiato)

# Font (xfce: UbuntuMono Nerd Font Italic 14, but renders upright there)
font_family      UbuntuMono Nerd Font
bold_font        UbuntuMono Nerd Font Bold
italic_font      UbuntuMono Nerd Font Italic
bold_italic_font UbuntuMono Nerd Font Bold Italic
font_size        14.0
text_composition_strategy 0.8 0

# Cursor: block, no blinking
cursor_shape          block
shell_integration     no-cursor
cursor_blink_interval 0

# Behaviour
scrollback_lines      -1
enable_audio_bell     no
window_alert_on_bell  no
copy_on_select        no
detect_urls           yes
confirm_os_window_close 1
mouse_hide_wait       0

# Window: 80x24, no decorations, opaque background
remember_window_size  no
initial_window_width  80c
initial_window_height 24c
hide_window_decorations yes
window_padding_width  2
background_opacity    1.0

# Tabs only shown with 2+ tabs, on top
tab_bar_edge     top
tab_bar_min_tabs 2

# Colors
foreground              #cad3f5
background              #24273a
selection_foreground    #cad3f5
selection_background    #5b6078
cursor                  #f4dbd6
cursor_text_color       #181926
url_color               #f4dbd6

active_tab_foreground   #181926
active_tab_background   #c6a0f6
inactive_tab_foreground #cad3f5
inactive_tab_background #1e2030

# black
color0  #494d64
color8  #5b6078
